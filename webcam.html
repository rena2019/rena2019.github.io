<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>QR-Code Generator & Scanner</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 20px auto;
    }
    #qrDisplay {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      display: inline-block;
    }
    #reader {
      width: 400px;
      margin-top: 20px;
    }
    textarea {
      width: 100%;
      height: 80px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
    }
    #scanResult {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #4caf50;
      background: #e8f5e9;
    }
  </style>

  <!-- QR-Code GENERATOR: qrcode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- QR-Code SCANNER: html5-qrcode CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <h1>QR-Code Generator & Scanner</h1>

  <h2>QR-Code generieren</h2>
  <label for="qrText">Text für QR-Code:</label><br />
  <textarea id="qrText" placeholder="Gib hier deinen Text ein..."></textarea><br />
  <button id="generateBtn">QR-Code erzeugen</button>

  <div id="qrDisplay"></div>

  <h2>QR-Code mit Webcam scannen</h2>
  <p>Klicke auf „Scan starten“, um die Kamera zu aktivieren und QR-Codes zu scannen.</p>
  <button id="startScanBtn">Scan starten</button>
  <button id="stopScanBtn" disabled>Scan stoppen</button>

  <div id="reader"></div>
  <div id="scanResult" style="display:none;"></div>

  <script>
    // --- QR-Code GENERIEREN ---
    let qr;
    const qrTextInput = document.getElementById('qrText');
    const qrDisplay = document.getElementById('qrDisplay');
    const generateBtn = document.getElementById('generateBtn');

    generateBtn.addEventListener('click', () => {
      const text = qrTextInput.value.trim();
      if (!text) {
        alert('Bitte Text eingeben.');
        return;
      }

      // vorhandenen QR-Code löschen
      qrDisplay.innerHTML = '';

      // neuen QR-Code erzeugen
      qr = new QRCode(qrDisplay, {
        text: text,
        width: 256,
        height: 256,
      });
    });

    // --- QR-Code SCANNEN MIT WEBCAM ---
    let html5QrCodeInstance = null;
    const startScanBtn = document.getElementById('startScanBtn');
    const stopScanBtn = document.getElementById('stopScanBtn');
    const scanResultBox = document.getElementById('scanResult');

    function onScanSuccess(decodedText, decodedResult) {
      // Ergebnis anzeigen
      scanResultBox.style.display = 'block';
      scanResultBox.textContent = 'Gescannter QR-Inhalt: ' + decodedText;

      // Wenn du nach erstem Treffer stoppen willst:
      // stopScanner();
    }

    function startScanner() {
      if (html5QrCodeInstance) {
        return; // schon aktiv
      }

      // Instanz erzeugen, Reader-DIV ist das Ziel
      html5QrCodeInstance = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      };

      Html5Qrcode.getCameras().then(cameras => {
        if (!cameras || cameras.length === 0) {
          alert('Keine Kamera gefunden.');
          return;
        }

        // erste gefundene Kamera nutzen
        const cameraId = cameras[0].id;

        html5QrCodeInstance.start(
          cameraId,
          config,
          onScanSuccess,
          errorMessage => {
            // Fehler beim Scannen (optional loggen)
            console.warn('Scan Fehler:', errorMessage);
          }
        ).then(() => {
          startScanBtn.disabled = true;
          stopScanBtn.disabled = false;
        }).catch(err => {
          console.error('Start-Fehler:', err);
          alert('Kamera konnte nicht gestartet werden: ' + err);
        });
      }).catch(err => {
        console.error('Kamera-Fehler:', err);
        alert('Fehler beim Zugriff auf Kameras: ' + err);
      });
    }

    function stopScanner() {
      if (!html5QrCodeInstance) return;

      html5QrCodeInstance.stop().then(() => {
        html5QrCodeInstance.clear();
        html5QrCodeInstance = null;
        startScanBtn.disabled = false;
        stopScanBtn.disabled = true;
      }).catch(err => {
        console.error('Stop-Fehler:', err);
      });
    }

    startScanBtn.addEventListener('click', startScanner);
    stopScanBtn.addEventListener('click', stopScanner);
  </script>
</body>
</html>
